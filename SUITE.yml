format_version: "0.1"
name: "IEC 61131-3 Formal Verification Benchmark Suite"
version: "1.0.0-dev"
license: CC-BY-4.0                    # suite-level; per-program license in each benchmark.yml
zenodo_doi: "TBD"
maintainers:
  - "Pierre Dantas <pierre.dantas@manchester.ac.uk>"
  - "Lucas C. Cordeiro <lucas.cordeiro@manchester.ac.uk>"
  - "Waldir Junior <waldirjr@ufam.edu.br>"
domains:
  - water_treatment
  - motor_control
  - manufacturing
  - chemical_batch
  - hvac
  - packaging
  - elevator
  - traffic
  - building_automation
  - power_substation
# Targets, not a census. The portal's benchmarks catalog counts what the tree actually
# holds, because a number written here goes stale the next time a program is added.
composition_target:            # reweighted 2026-07-09 to match real ecosystem supply
  LD-textual: 15                # scarce: only the K-LD .ld DSL exists
  LD-graphical: 25             # abundant: PLCopen XML (PLC-LD-dataset, PPU)
  ST: 10                       # abundant: S-benchmarks + SWaT
  FBD: 2                       # language coverage, authored 2026-08-26; tree now holds 6
  SFC: 2                       # language coverage, authored 2026-08-26; tree now holds 4
  IL: 2                        # language coverage, authored 2026-08-26
# Index is generated by runner/build_index.py — id -> {path, language, domain, verdict}.
benchmarks: []
