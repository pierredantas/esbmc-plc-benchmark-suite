  verdict_basis:
    method: cross-tool-consensus
    confirmed_by:
    - esbmc-8.6-ladder
    - plcverif
    witness: ESBMC 8.6 (ladder front end) and PLCverif each return the same verdict on every property. The properties were written by the suite authors from what the program evidently does; the program
      was written by others.
