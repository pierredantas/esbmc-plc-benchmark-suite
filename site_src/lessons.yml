# Teaching order lives here, never in a slug. A lesson can be renumbered or moved to
# another part without changing its URL, which is what published links depend on.
parts:
  - title: Getting started
    blurb: >-
      Small synthetic ladders, one idea each. Every program here is a few elements
      long, so the encoding ESBMC produces is short enough to read line by line.
    lessons:
      - slug: one-rung
        number: "1.1"
        title: "One rung: contacts and a coil"
        summary: "The smallest ladder that verifies. Three contacts in series, one coil, one property, one proof."
      - slug: series-parallel
        number: "1.2"
        title: "Series, parallel, and the wired OR"
        summary: "Two branches into one coil. The shipped property is proved, and it would have been proved just as soundly by a front end that dropped the second branch. A second property makes the branch's survival checkable."
      - slug: interlock
        number: "1.3"
        title: "A reversing starter, proved and broken"
        summary: "One motor, two contactors, one property. A k-induction proof, then the same ladder with a contact deleted and the counterexample that follows."
      - slug: seal-in
        number: "1.4"
        title: "A seal-in latch, where the verdict hides the encoding"
        summary: "The circuit verifies as safe, and that verdict is equally true of a latch, of a plain conjunction, and of a program that assigns nothing. It takes a second property to tell them apart."
      - slug: edges-and-scan-order
        number: "1.5"
        title: "Edges, and the order rungs run in"
        summary: "Three rungs whose order is the design. Both builds run them in an order the file never specified, and the standard says the benchmark is right."
      - slug: timers
        number: "1.6"
        title: "Timers, and the tick they count"
        summary: "A preset is measured in scans. One build models the timer, the other drops the block, and the benchmark's own property turns out to be false of an off-delay."
      - slug: counters
        number: "1.7"
        title: "Counters, and a pin that is not read"
        summary: "CTU counts and resets. CTD wires its IEC load pin, the front end reads only R, and the modelled counter never reloads."
      - slug: memory-and-time
        number: "1.8"
        title: "Memory and time together"
        summary: "A timer sets a latched alarm and an acknowledgement clears it. Reset dominance is correct here, and the reason it is correct is an accident of emission order."

  - title: Machines and their hazards
    blurb: >-
      Real plants, one industrial domain at a time. Each lesson names the machine, the
      thing that must never happen to it, and what a verifier does with a program in
      which someone hid a way to make it happen.
    lessons:
      - slug: conveyor
        number: "2.1"
        title: "A conveyor that ignores its emergency stop"
        summary: "One added branch, conducting only when the E-stop is pressed and a maintenance key is turned, and the counterexample that hands you the combination."
      - slug: batch-reactor
        number: "2.2"
        title: "A reactor that keeps feeding under pressure"
        summary: "The same bypass in a chemical plant, where the relief vent still works and makes the attack look like a functioning protection system. Then a reasonable-sounding weakening of the property that lets the bomb through."
      - slug: traffic-light
        number: "2.3"
        title: "A junction that shows two greens"
        summary: "The bypass a third time, and a careful account of what conflict-freedom leaves open: no intergreen, no minimum green, and a stuck detector that starves one arm forever."
      - slug: elevator-door
        number: "2.4"
        title: "A car that moves with its door open"
        summary: "The same machine as a rung and as a chart. One bomb adds a branch, the other changes a single letter, and only one of them is caught."
      - slug: hvac-fan
        number: "2.5"
        title: "An air handler whose name promises a timer"
        summary: "Heating and cooling interlocked correctly, a bypass that defeats it, and a benchmark called fan_delay whose program contains no block at all."
      - slug: substation
        number: "2.6"
        title: "A substation, three interlocks and one key"
        summary: "Busbar, breaker and transformer defeated by the same input, and the protection layer the attacker deliberately leaves working."
      - slug: lighting-override
        number: "2.7"
        title: "The override you cannot tell from the attack"
        summary: "The same branch is a legitimate maintenance override or a bomb, and nothing in the program decides which. The property does."
      - slug: machine-family
        number: "2.8"
        title: "The family, and what it does not cover"
        summary: "All twelve machines in one table, what is identical and what changes across them, and the trigger shapes this part never showed."

  - title: Logic-level bombs
    blurb: >-
      The same programs, organized by the shape of the attack rather than by the plant
      it was fitted to, and the trigger shapes that defeat testing by construction.
    lessons:
      - slug: what-is-an-llb
        number: "3.1"
        title: "What a logic-level bomb is"
        summary: "Trigger, payload and dormancy, the three trigger shapes the catalog carries, and why sampling cannot find any of them."
      - slug: fuses
        number: "3.2"
        title: "Bombs that wait"
        summary: "A fifty-scan fuse, SAFE at eight scans and VIOLATION at sixty-four, and why the first answer is a correct proof about the wrong program."
      - slug: scale
        number: "3.3"
        title: "When the fuse outruns the checker"
        summary: "Five identical bombs at fuse widths from 255 to 32767 scans, all found, at 0.9 seconds and 406 seconds respectively, and why unwinding further is a race the defender loses."
      - slug: non-termination
        number: "3.4"
        title: "The payload that produces no output"
        summary: "A loop whose counter is never advanced, entered at one sensor value, and the scan watchdog that catches it. Plus the flag combination that reports the hang as proved."
      - slug: trigger-synthesis
        number: "3.5"
        title: "The counterexample as the recovered knock"
        summary: "A reachability property inverted into an assertion, unreachable on the clean program and recovering fwd, rev and maint on the bombed one, which is exactly what was planted."
      - slug: what-a-property-says
        number: "3.6"
        title: "What a property has to say"
        summary: "Eight things the failures on this site have in common, from naming a consequence to carrying the bound, and the twenty-six recorded runs whose verdict meant nothing."

  - title: Code from the plant
    blurb: >-
      Programs neither of us wrote: what a real engineering tool emits, and what it
      costs to verify code that arrived from somewhere else.
    lessons:
      - slug: real-export
        number: "4.1"
        title: "The one file nobody here wrote"
        summary: "A 2019 TwinCAT export: the only program of fifty-five that passed the PLCopen schema, and the one where nothing is where the standard says it should be."
      - slug: real-code-costs
        number: "4.2"
        title: "What real plant code costs"
        summary: "Five SWaT benchmarks that cannot be ported without deleting the bomb, because the attack is written in a vendor exception mechanism. The sixth now has a verdict, once termination stopped being treated as inexpressible."

  - title: Bombs from a public dataset
    blurb: >-
      Eight legitimate and malicious pairs of one water tank controller, published by
      other people with their own labels, and a single property that refutes all eight.
    lessons:
      - slug: tank-dataset
        number: "5.1"
        title: "A tank, and eight ways to stop it"
        summary: "The plant, the one property that covers every attack in this part, and why a program that never finishes a scan is worse than one that computes the wrong answer."
      - slug: injected-loop
        number: "5.2"
        title: "The loop that never ends"
        summary: "Ten lines appended to a working function block, a counter assigned on every pass that never advances, and a trigger whose constant is not the sensor value that fires it."
      - slug: look-alike-block
        number: "5.3"
        title: "A block that is not the block it names"
        summary: "EQ becomes EQ_0, the replacement reimplements equality correctly, and the payload sits below the part that answers the question a reviewer came with."
      - slug: inlined-guard
        number: "5.4"
        title: "The refactor that carried a payload"
        summary: "A POU deleted and its logic inlined, which is a large diff with a plausible story attached, and the one attack that names the raw input in its guard."
      - slug: tank-family
        number: "5.5"
        title: "Eight bombs, one property"
        summary: "Sixteen programs settled in 0.74 seconds, and what termination covers that an interlock property cannot."

  - title: The languages ladder cannot reach
    blurb: >-
      Function block diagrams and sequential function charts, where the ladder front end
      reads nothing and says so in three different ways: a missed defect, a false alarm,
      and a proof about an empty program.
    lessons:
      - slug: fbd-unread
        number: "6.1"
        title: "A diagram the checker never read"
        summary: "An air handler permissive with one wire deleted. The ladder route now refuses the file by name, which it did not do until esbmc#7354 was fixed, and the C route names the violated property."
      - slug: fbd-false-alarm
        number: "6.2"
        title: "The false alarm"
        summary: "A two-out-of-three vote that works, once refuted with a plausible counterexample and now refused outright. The table that made the case for recording encodings, and why the fix does not retire it."
      - slug: sfc-no-verdict
        number: "6.3"
        title: "Four charts and no verdict"
        summary: "Every SFC benchmark is refused at parse, which is an improvement on the SAFE they used to report. Pointing the second route at them broke in three different layers, and the third has not been cleared."
      - slug: textual-ladder
        number: "6.4"
        title: "The spelling nothing here reads"
        summary: "Ladder written as text rather than drawn. Fifteen programs, no recorded run on either route, and twelve graphical twins that verify while the files beside them cannot be checked at all."

  - title: Safety functions from the standards
    blurb: >-
      Seven machines whose control logic exists because a clause in a standard asks for
      it. Each one ships the property an engineer would write, a second program the
      property cannot tell apart from the first, and the property that can.
    lessons:
      - slug: estop-reset
        number: "7.1"
        title: "The reset nobody has to press"
        summary: "A monitored reset and an automatic restart, and one emergency-stop property that is true of both. The discriminator is refuted in the first scan, which is the requirement arriving on time."
      - slug: two-hand
        number: "7.2"
        title: "Both buttons held, and the press stays up"
        summary: "ISO 13851 Type II against Type I. The obvious property is true of the device you can defeat with tape, and true of it for a stronger reason than of the good one."
      - slug: star-delta
        number: "7.3"
        title: "The gap between two contactors"
        summary: "Mutual exclusion proved on a starter with a dead time and on one without. What the proof covers is two program variables, and a contactor is not a program variable."
      - slug: door-reversal
        number: "7.4"
        title: "The door that pauses instead of reversing"
        summary: "A latched reversal and a momentary one. The safety property is true of both; only a question about what the latch still holds after the beam clears tells them apart."
      - slug: burner-lockout
        number: "7.5"
        title: "A lockout that lets go"
        summary: "EN 298 light-off order, proved on a burner whose lockout clears itself. The order is right in both programs, and only the lockout question separates them."
      - slug: pump-alternation
        number: "7.6"
        title: "The standby pump nobody started"
        summary: "Duty-standby alternation, and the first discriminator in this part that neither build can discharge. A five-line reproducer of a k-induction limit comes with it."
      - slug: guard-lock
        number: "7.7"
        title: "The guard that waits for the spindle"
        summary: "ISO 14119 guard locking with a real rundown timer. The discriminator asks whether the program waits rather than whether it remembers."
      - slug: compressor-cycle
        number: "7.8"
        title: "The interlock that makes it wait"
        summary: "A minimum-off interlock against a short-cycling twin, and the table that has been the same in every discriminator pair."
      - slug: two-hand-fb
        number: "7.9"
        title: "The block the checker stops reading"
        summary: "Lesson 7.2's press moved into a function block. Both builds fail the gate on the correct program and refute a property that holds on the correct variant, because block parameters are never bound and a boolean body loses an operand."
      - slug: textbook-race
        number: "7.10"
        title: "Two textbook rungs, transcribed"
        summary: "A cross-interlocked forward/reverse starter that a relay panel gets for free and a scan cycle does not, and a fail-safe latch whose textbook property will not parse until an implication is rewritten by hand."
