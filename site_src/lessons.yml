# Teaching order lives here, never in a slug. A lesson can be renumbered or moved to
# another part without changing its URL, which is what published links depend on.
parts:
  - title: Foundations
    blurb: >-
      Small synthetic ladders, one idea each. Every program here is a few elements
      long, so the encoding ESBMC produces is short enough to read line by line.
    lessons:
      - slug: one-rung
        number: "1.1"
        title: "One rung: contacts and a coil"
        summary: "The smallest ladder that verifies. Three contacts in series, one coil, one property, one proof."
      - slug: series-parallel
        number: "1.2"
        title: "Series, parallel, and the wired OR"
        summary: "Two branches into one coil. Both builds prove the shipped property, and only one of them encoded the second branch at all."
      - slug: interlock
        number: "1.3"
        title: "A reversing starter, proved and broken"
        summary: "One motor, two contactors, one property. A k-induction proof, then the same ladder with a contact deleted and the counterexample that follows."
      - slug: seal-in
        number: "1.4"
        title: "A seal-in latch, where the verdict hides the encoding"
        summary: "Two ESBMC builds agree the circuit is safe. Only one of them encoded a latch, and it takes a second property to find out which."
      - slug: edges-and-scan-order
        number: "1.5"
        title: "Edges, and the order rungs run in"
        summary: "Three rungs whose order is the design. Both builds run them in an order the file never specified, and the standard says the benchmark is right."
      - slug: timers
        number: "1.6"
        title: "Timers, and the tick they count"
        summary: "A preset is measured in scans. One build models the timer, the other drops the block, and the benchmark's own property turns out to be false of an off-delay."
      - slug: counters
        number: "1.7"
        title: "Counters, and a pin that is not read"
        summary: "CTU counts and resets. CTD wires its IEC load pin, the front end reads only R, and the modelled counter never reloads."
      - slug: memory-and-time
        number: "1.8"
        title: "Memory and time together"
        summary: "A timer sets a latched alarm and an acknowledgement clears it. Reset dominance is correct here, and the reason it is correct is an accident of emission order."

  - title: Machines and their hazards
    blurb: >-
      Real plants, one industrial domain at a time. Each lesson names the machine, the
      thing that must never happen to it, and what a verifier does with a program in
      which someone hid a way to make it happen.
    lessons:
      - slug: conveyor
        number: "2.1"
        title: "A conveyor that ignores its emergency stop"
        summary: "One added branch, conducting only when the E-stop is pressed and a maintenance key is turned, and the counterexample that hands you the combination."
      - slug: batch-reactor
        number: "2.2"
        title: "A reactor that keeps feeding under pressure"
        summary: "The same bypass in a chemical plant, where the relief vent still works and makes the attack look like a functioning protection system. Then a reasonable-sounding weakening of the property that lets the bomb through."

