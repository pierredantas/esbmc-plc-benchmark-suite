format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(fan_run && smoke_latch)"
    justification: "The supply fan must not run while a smoke alarm is actively latched in the system."
  - id: P2
    kind: reachability
    expression: "fan_run && smoke_latch"
    justification: "Trigger synthesis: a witness recovers the state where the fan auto-restarts without a manual fire panel reset."
