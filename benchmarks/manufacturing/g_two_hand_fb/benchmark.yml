format_version: "0.1"
id: g_two_hand_fb
name: "two-hand control as a function block"
domain: manufacturing
language: LD-graphical
source:
  origin: authored
  reference: "The ISO 13851 Type II logic of g_two_hand moved into a reusable function block, the shape certified safety libraries ship it in"
  license: CC-BY-4.0
properties_file: props.yaml
safety_intent: "The ram must descend only while both hand actuators are held; releasing either one must stop the stroke."
validation_status: validated
semantics:
  scan_order: "sequential rung order within one scan"
  retained_state: "values carry over between scans and are exchanged between program units"
  verdict_scope: "holds under the stated scan order"
syntax_pair_of: g_two_hand
variants:
  - file: program.xml
    expected_verdict: true
    verdict_basis:
      method: expert
      witness: "The expected verdict follows from the ladder twin g_two_hand, which both ESBMC builds verify. On this function-block rendering ESBMC 8.4 returns SAFE but fails the ingestion gate, because its frontend does not bind the block's actual parameters and Stroke is never driven. ESBMC 8.6 passes the gate and returns SAFE, and so does the C route through MATIEC."
  - file: type_i.xml
    expected_verdict: true
    verdict_basis:
      method: fault-injection
      base_variant: program.xml
      seeded_defect: "The arming latch is dropped from the block body, leaving the Type I conjunction, exactly as in g_two_hand/type_i.xml."
      witness: "Expected SAFE by construction and confirmed on the ladder twin. ESBMC 8.4 and 8.6 both return SAFE here, and so does the C route through MATIEC."
features: [function_block, multi_pou, latch]
difficulty: medium
tags: [safety-function, frontend-gap, syntax-pair]
