format_version: "0.1"
properties:
  - id: P1
    kind: mutual_exclusion
    variables: [vfd_out, bypass_cont]
    justification: "VFD output and bypass contactors must never close together to prevent catastrophic short circuits."
  - id: P2
    kind: reachability
    expression: "vfd_out && bypass_cont"
    justification: "Trigger synthesis: a witness recovers the failure condition causing simultaneous contactor closure."
