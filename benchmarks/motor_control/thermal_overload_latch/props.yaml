format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(motor_run && overload_latch)"
    justification: "The motor must not be allowed to run while a thermal overload condition is actively latched."
  - id: P2
    kind: reachability
    expression: "motor_run && overload_latch"
    justification: "Trigger synthesis: a witness recovers the auto-restart condition when the motor cools before manual reset."
