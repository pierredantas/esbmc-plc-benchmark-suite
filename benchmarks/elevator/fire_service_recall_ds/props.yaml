format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "fire_alarm -> !normal_run"
    justification: "Normal operation must be disabled during fire alarm."
  - id: P2
    kind: reachability
    expression: "fire_alarm && normal_run"
    justification: "Witness: fire_alarm=1 reaches normal_run=1 in bomb."
