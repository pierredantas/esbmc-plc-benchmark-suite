format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "overspeed_trip -> brake_applied"
    justification: "Overspeed trip must apply the brake."
  - id: P2
    kind: reachability
    expression: "overspeed_trip && !brake_applied"
    justification: "Witness: overspeed_trip=1 reaches brake_applied=0 in bomb."
