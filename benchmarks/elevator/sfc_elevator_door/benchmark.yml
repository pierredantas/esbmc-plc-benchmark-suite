format_version: "0.1"
id: sfc_elevator_door
name: "Car door cycle with a stored action (SFC)"
domain: elevator
language: SFC
source:
  origin: authored
  reference: "Four-step door cycle, authored for SFC language coverage"
  license: CC-BY-4.0
