format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "(upper_buffer || lower_buffer) -> !drive_enable"
    justification: "Drive must be disabled if either buffer switch is actuated."
  - id: P2
    kind: reachability
    expression: "upper_buffer && drive_enable"
    justification: "Witness: upper_buffer=1 reaches drive_enable=1 in bomb."
