format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(car_run && trip_latch)"
    justification: "The elevator car must never be allowed to run while the overspeed safety latch is in a tripped state."
  - id: P2
    kind: reachability
    expression: "car_run && trip_latch"
    justification: "Trigger synthesis: a witness recovers the state where the car runs despite a latched overspeed trip."
