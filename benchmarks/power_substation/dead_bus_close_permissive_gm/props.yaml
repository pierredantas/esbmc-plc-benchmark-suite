format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(tie_close && bus1_live && bus2_live && !sync_ok)"
    justification: "A tie breaker must never parallel two live buses unless their voltage and phase are synchronized."
  - id: P2
    kind: reachability
    expression: "tie_close && bus1_live && bus2_live && !sync_ok"
    justification: "Trigger synthesis: a witness recovers the condition where the breaker closes onto unsynchronized live buses."
