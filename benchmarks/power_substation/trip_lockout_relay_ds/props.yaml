format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "backup_trip -> fail_latch"
    justification: "Backup trip must only be issued through the latched failure relay, never directly from the trip command."
  - id: P2
    kind: reachability
    expression: "backup_trip && !fail_latch"
    justification: "Witness: trip_cmd=1 then trip_cmd=0 reaches backup_trip=1, fail_latch=0 in bomb."
