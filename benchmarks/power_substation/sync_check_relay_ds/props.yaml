format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "breaker_close -> sync_ok"
    justification: "Breaker must not close unless sync conditions are satisfied."
  - id: P2
    kind: reachability
    expression: "breaker_close && !sync_ok"
    justification: "Witness: req_close=1, sync_ok=0 reaches violation."
