properties:
  - id: P1
    kind: invariant
    expression: "!(disc_cmd && brk_closed)"
    justification: "The mechanical disconnector must never actuate while the main breaker is closed under load to prevent arcing."
  - id: P2
    kind: reachability
    expression: "disc_cmd && brk_closed"
    justification: "Trigger synthesis: a witness recovers the maintenance-bypass input combination that causes an arcing fault."
