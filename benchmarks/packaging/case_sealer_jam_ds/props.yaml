format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "jam_detected -> !conveyor_run"
    justification: "Conveyor must stop if a jam is detected."
  - id: P2
    kind: reachability
    expression: "jam_detected && conveyor_run"
    justification: "Witness: jam_detected=1, conveyor_req=1 reaches conveyor_run=1 in bomb."
