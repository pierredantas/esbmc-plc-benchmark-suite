format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "web_break -> !labeler_run"
    justification: "Labeler must stop if web break is detected."
  - id: P2
    kind: reachability
    expression: "web_break && labeler_run"
    justification: "Witness: web_break=1, labeler_req=1 reaches labeler_run=1 in bomb."
