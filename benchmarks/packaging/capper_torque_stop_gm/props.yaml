format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(motor_run && fault_latch)"
    justification: "The capper motor must remain disabled while a high-torque fault is actively latched."
  - id: P2
    kind: reachability
    expression: "motor_run && fault_latch"
    justification: "Trigger synthesis: a witness recovers the state where the motor auto-restarts without a manual reset."
