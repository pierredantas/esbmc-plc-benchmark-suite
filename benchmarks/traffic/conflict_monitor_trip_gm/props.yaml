format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(solid_green && conflict_detect)"
    justification: "Solid green lights must never be energized while the hardware conflict monitor detects an electrical fault."
  - id: P2
    kind: reachability
    expression: "solid_green && conflict_detect"
    justification: "Trigger synthesis: a witness recovers the premature reset condition that enables a green light during an active fault."
