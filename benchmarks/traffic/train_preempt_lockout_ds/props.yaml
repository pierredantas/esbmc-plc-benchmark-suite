format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "rail_clear -> gates_closed"
    justification: "Rail clear signal must only be given when gates are closed."
  - id: P2
    kind: reachability
    expression: "rail_clear && !gates_closed"
    justification: "Witness: train_approach=1, gates_closed=0 reaches rail_clear=1 in bomb."
