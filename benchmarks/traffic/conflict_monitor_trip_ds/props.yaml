format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "fault_latch -> flash_mode"
    justification: "When fault is latched, flash mode must be active."
  - id: P2
    kind: reachability
    expression: "conflict_fault && !fault_latch"
    justification: "Witness: conflict_fault=1, manual_reset=0 reaches violation (fault ignored)."
