format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "!(heater_run && !agitator_run)"
    justification: "The reactor heater must never run without the agitator to prevent localized boiling and explosion."
  - id: P2
    kind: reachability
    expression: "heater_run && !agitator_run"
    justification: "Trigger synthesis: a witness recovers the override condition that allows heating without agitation."
