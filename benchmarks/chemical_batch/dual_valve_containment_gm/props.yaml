format_version: "0.1"
properties:
  - id: P1
    kind: mutual_exclusion
    variables: [feed_v, vent_v]
    justification: "Feed and vent valves must never open simultaneously to prevent hazardous chemical pass-through."
  - id: P2
    kind: reachability
    expression: "feed_v && vent_v"
    justification: "Trigger synthesis: a witness recovers the simultaneous request condition that breaches containment."
