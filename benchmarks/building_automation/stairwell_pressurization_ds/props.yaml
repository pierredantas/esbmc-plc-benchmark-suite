format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "fan_on -> fire_alarm"
    justification: "Stairwell fan must run only during a fire alarm."
  - id: P2
    kind: reachability
    expression: "fan_on && !fire_alarm"
    justification: "Witness: pressure_low=1, fire_alarm=0 reaches fan_on=1 in bomb."
