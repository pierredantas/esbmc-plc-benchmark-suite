format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "fan_on -> (damper_open && !fire_alarm)"
    justification: "AHU fan must only run if damper is open and no fire alarm."
  - id: P2
    kind: reachability
    expression: "fan_on && !damper_open"
    justification: "Witness: fan_req=1, damper_open=0, fire_alarm=0 reaches fan_on=1 in bomb."
