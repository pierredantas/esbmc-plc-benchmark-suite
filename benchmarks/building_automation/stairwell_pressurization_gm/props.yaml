    expression: "!(fan_run && high_pressure)"
    justification: "The pressurization fan must never run if high static pressure is detected, preventing structural duct rupture."
  - id: P2
    kind: reachability
    expression: "fan_run && high_pressure"
    justification: "Trigger synthesis: a witness recovers the priority-inversion state that causes over-pressurization."
