format_version: "0.1"
properties:
  - id: P1
    kind: reachable
    expression: "lockdown_latch && !forced_alarm && !guard_reset"
    justification: "Once triggered, the security lockdown must remain active even if the forced door is closed, until a guard resets it: the latch must be able to hold with the alarm cleared and no reset. The bomb drops the seal-in, so it cannot reach this state."
  - id: P2
    kind: reachability
    expression: "!lockdown_latch && forced_alarm && !guard_reset"
    justification: "Trigger synthesis: a witness recovers the failure of the security latch to hold."
