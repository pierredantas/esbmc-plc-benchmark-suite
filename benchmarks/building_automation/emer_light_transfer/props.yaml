format_version: "0.1"
properties:
  - id: P1
    kind: mutual_exclusion
    variables: [norm_cont, emer_cont]
    justification: "Normal and emergency power contactors must never be closed together to prevent dangerous grid backfeeding."
  - id: P2
    kind: reachability
    expression: "norm_cont && emer_cont"
    justification: "Trigger synthesis: a witness recovers the failure condition causing simultaneous contactor closure."
