format_version: "0.1"
properties:
  - id: P1
    kind: invariant
    expression: "door_forced -> lock_hold"
    justification: "If door is forced open, the lock must be engaged (door held locked)."
  - id: P2
    kind: reachability
    expression: "door_forced && !lock_hold"
    justification: "Witness: door_forced=1 reaches lock_hold=0 in bomb."
