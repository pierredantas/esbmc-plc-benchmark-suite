format_version: "0.1"
properties:
  - id: P1
    kind: mutual_exclusion
    variables: [service_v, backwash_v]
    justification: "Service and backwash valves must never open simultaneously."
  - id: P2
    kind: reachability
    expression: "service_v && backwash_v"
    justification: "Trigger synthesis: a witness recovers the failure condition causing simultaneous valve opening."
