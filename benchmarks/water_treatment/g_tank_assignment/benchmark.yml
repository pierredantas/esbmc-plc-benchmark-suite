format_version: "0.1"
id: g_tank_assignment
name: "Tank valve controller — assignment (graphical LD)"
domain: water_treatment
language: LD-graphical
source:
  origin: plc-ld-dataset
  reference: "PLC-LD-dataset, github.com/UniboSecurityResearch/PLC-LD-dataset (Iacobelli et al., ICPS 2024, doi:10.1109/ICPS59941.2024.10639995); legitimate/malicious LLB pair, PLCopen XML"
  license: "GPL-3.0"
properties_file: props.yaml
safety_intent: "Every PLC scan cycle must complete; no while-loop may run without its counter advancing, which would hang the scan."
validation_status: candidate
semantics:
  scan_order: "sequential rung order within one scan"
  retained_state: "values carry over between scans and are exchanged between program units"
  arithmetic: "H1: no integer overflow; the program can overflow, so SAFE is conditional"
  verdict_scope: "semantics-dependent"
variants:
  - file: legitimate_lassignment.xml
    expected_verdict: true
    verdict_basis:
      method: cross-tool-consensus
      confirmed_by: [esbmc-plc+]
  - file: malicious_massignment.xml
    expected_verdict: false
    violated_properties: [P1]
    verdict_basis:
      method: fault-injection
      base_variant: legitimate_lassignment.xml
      seeded_defect: "Injected non-terminating while-loop (loop counter never incremented), gated on a trigger sensor value."
      witness: "A trigger input (e.g. IN1=12) enters the loop that never exits; the scan-watchdog flags the hang."
features: [contacts, coils, function_block]
difficulty: medium
tags: [security, llb, non-termination]
