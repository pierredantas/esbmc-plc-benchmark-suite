format_version: "0.1"
id: st_swat_sub1
name: "SWaT multi-PLC level control — sub1"
domain: water_treatment
language: ST
source:
  origin: swat
  reference: "SWaT testbed via PLC_Defuser, github.com/UniboSecurityResearch/PLC_Defuser (Datasets/SWAT); legitimate/malicious LLB pair"
  license: "GPL-3.0"
properties_file: props.yaml
validation_status: candidate
semantics:
  scan_order: "sequential statement order"
  retained_state: "values carry over between scans and are exchanged between program units"
  verdict_scope: "holds under the stated scan order"
variants:
  - file: sleg_sub1_0.st
    expected_verdict: true
    verdict_basis:
      method: cross-tool-consensus
      confirmed_by: [esbmc-plc+]
  - file: smal_sub1_0.st
    expected_verdict: false
    violated_properties: [P1]
    verdict_basis:
      method: fault-injection
      base_variant: sleg_sub1_0.st
      seeded_defect: "Injected non-terminating while-loop in a comparator function block (loop variable never reaches the exit bound), gated on a trigger sensor value."
      witness: "A trigger input (e.g. IN2=20.0) enters the loop that never exits; the scan-watchdog flags the hang."
features: [function_block, arithmetic_int, multi_pou]
difficulty: hard
tags: [security, llb, non-termination, multi-plc]
