name: portal

# No verifier runs here: the panels come from results/records/*.json, so the site
# builds without ESBMC on the runner.
on:
  push:
    branches: [main]
    paths:
      - 'site_src/**'
      - 'benchmarks/**'
      - 'results/records/**'
      - 'docs/BUILD_MACOS.md'
      - 'CITATION.cff'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site_src/requirements.txt
      - run: pip install -r site_src/requirements.txt
      - run: python site_src/build.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
