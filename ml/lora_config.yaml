# LoRA fine-tune config for props.yaml generation.
# Run: mlx_lm.lora -c ml/lora_config.yaml

model: mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit
train: true
fine_tune_type: lora
data: ml/data
adapter_path: ml/adapters/qwen2.5-coder-1.5b-props

num_layers: 8
batch_size: 2
iters: 400
val_batches: 10
learning_rate: 1e-4
steps_per_report: 20
steps_per_eval: 50
save_every: 100
max_seq_length: 4096
grad_checkpoint: true
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
