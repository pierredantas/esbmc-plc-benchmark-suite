# LoRA fine-tune config for props.yaml generation on the 14B base model,
# same 389-example dataset the 7B checkpoints use, to test whether the
# reasoning-limit cases found at 7B (st_two_hand, g_elevator_door — both
# fail to reproduce their own training example despite the correct answer
# appearing repeatedly) resolve at a larger base model size, per
# ml/README.md "Next levers" #8.
#
# Build the dataset first with:
#   python3 ml/scripts/build_dataset.py --augment-st
#
# 14B base weights are ~8.3GB (vs. ~4GB for 7B); a smoke test on this
# 24GB-unified-memory machine confirmed the base model loads and generates
# correctly at ~8.2GB peak RSS for inference alone. batch_size 1 and
# grad_checkpoint carried over from the 7B config as a starting point —
# expect a higher peak than 7B's 12.6GB and watch for memory-pressure
# thrashing; drop max_seq_length or num_layers first if it OOMs, before
# assuming the experiment is infeasible on this hardware.
# Run: mlx_lm.lora -c ml/lora_config_14b.yaml

model: mlx-community/Qwen2.5-Coder-14B-Instruct-4bit
train: true
fine_tune_type: lora
data: ml/data
adapter_path: ml/adapters/qwen2.5-coder-14b-props-nary

num_layers: 8
batch_size: 1
iters: 640
val_batches: 10
learning_rate: 1e-4
steps_per_report: 20
steps_per_eval: 80
save_every: 160
max_seq_length: 4096
grad_checkpoint: true
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
