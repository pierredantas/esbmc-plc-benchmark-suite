# LoRA fine-tune config on the ST-augmented dataset plus two authored N-ary
# (N>2) mutual_exclusion benchmarks (st_three_pump_lockout, N=3; and, held
# out for eval, st_quad_valve_lockout, N=4) — see ml/README.md "N-ary
# mutual_exclusion" section.
# Run: mlx_lm.lora -c ml/lora_config_nary.yaml
#
# Build the dataset first with:
#   python3 ml/scripts/build_dataset.py --augment-st --force-train st_three_pump_lockout

model: mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit
train: true
fine_tune_type: lora
data: ml/data
adapter_path: ml/adapters/qwen2.5-coder-1.5b-props-nary

num_layers: 8
batch_size: 2
iters: 640
val_batches: 10
learning_rate: 1e-4
steps_per_report: 20
steps_per_eval: 80
save_every: 160
max_seq_length: 4096
grad_checkpoint: true
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
