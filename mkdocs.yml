site_name: IEC 61131-3 Verification Benchmark Suite
site_description: Ladder programs, safety properties, and recorded ESBMC runs for verifying PLC code.
site_url: https://pierredantas.github.io/esbmc-plc-benchmark-suite/
repo_url: https://github.com/pierredantas/esbmc-plc-benchmark-suite
repo_name: esbmc-plc-benchmark-suite
copyright: Programs and properties CC-BY-4.0. Runner code under LICENSE-CODE.

# portal/ is generated by site_src/build.py and is not tracked.
docs_dir: portal
site_dir: _site
strict: true
edit_uri: ""

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Lessons:
      - lessons/index.md
      - lessons/01-interlock/index.md
      - lessons/02-seal-in/index.md
  - Benchmarks: benchmarks/index.md
  - Reproducing: reproducing.md
  - Building ESBMC on macOS: build-macos.md
  - Citing: citing.md
