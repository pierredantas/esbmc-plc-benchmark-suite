INHERIT: nav.generated.yml

site_name: IEC 61131-3 Verification Benchmark Suite
site_description: Ladder programs, safety properties, and recorded ESBMC runs for verifying PLC code.
site_url: https://pierredantas.github.io/esbmc-plc-benchmark-suite/
repo_url: https://github.com/pierredantas/esbmc-plc-benchmark-suite
repo_name: esbmc-plc-benchmark-suite
copyright: Programs and properties CC-BY-4.0. Runner code under LICENSE-CODE.

# portal/ is generated by site_src/build.py and is not tracked.
docs_dir: portal
site_dir: _site
strict: true
edit_uri: ""

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.path
    - navigation.top
    - search.highlight
    - toc.follow
  # One palette, no toggle. A second palette puts a reader's choice in localStorage,
  # where it outlives any change made here, so the only way to guarantee light for
  # everyone is to leave the dark scheme undefined.
  palette:
    scheme: default
    primary: teal
    accent: teal

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

